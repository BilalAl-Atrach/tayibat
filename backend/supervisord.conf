[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Laravel Queue Worker - Process payment and contact message jobs
[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/laravel-worker.log
stopwaitsecs=3600

; Attempt to gracefully stop the job before killing it
stopsignal=TERM

; Retry failed jobs periodically
[program:laravel-job-retry]
process_name=%(program_name)s
command=php /app/artisan queue:retry-batch
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/laravel-job-retry.log
startsecs=0
stopwaitsecs=10

; Monitor and cleanup stale jobs
[program:laravel-job-monitor]
process_name=%(program_name)s
command=php /app/artisan queue:monitor
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/laravel-job-monitor.log
startsecs=0
stopwaitsecs=10
